[project]
name = "nq-adaptive-scalper"
version = "0.12.0"
description = "Adaptive NQ futures 1-minute candle scalper for TopstepX"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "websockets>=12.0",
    "aiohttp>=3.9",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "structlog>=23.2",
    "rich>=13.7",
    "click>=8.1",
    "signalrcore>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
]
backtest = [
    "matplotlib>=3.8",
    "plotly>=5.18",
]

[project.scripts]
nq-scalper = "scalper.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
